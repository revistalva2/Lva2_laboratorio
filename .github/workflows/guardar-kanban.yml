name: Guardar Kanban en Servidor

on:
  repository_dispatch:
    types: [actualizar-kanban]

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Actualizar archivo JSON con los datos recibidos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payloadData = context.payload.client_payload.data;
            
            // Sobrescribir el archivo JSON en el servidor
            fs.writeFileSync('kanban/kanban-data.json', JSON.stringify(payloadData, null, 2));

      - name: Hacer commit y push automáticos
        run: |
          git config --global user.name "Kanban Bot"
          git config --global user.email "bot@lva2.es"
          git add kanban/kanban-data.json
          git commit -m "Actualización automática del tablero Kanban [skip ci]"
          git push
